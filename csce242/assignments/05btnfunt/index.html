<!DOCTYPE html>
<html>
    <head>
        <title>05 button/function </title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
        
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <span class="header-dots">•••</span>
                <h1>Assignment 5 JS</h1>
                <nav id="main-nav">
                    <ul class="columns">
            <main class="projects">
              <section class="project-card" id="speech-card">
                <span class="card-dots">•••</span>
                <h3>Speech</h3>
                <div class="card-body">  
                  <button id="speech-button">Hear Speech</button><div id="speech-bubble" class="speech-bubble hidden">Hi</div>
                </div>
            </section>

            <section class="project-card" id="beverage-card">
                <span class="card-dots">•••</span>
                <h3>Beverage</h3>
                <div class="card-body">
                    <div class="beverage-controls">
                        <label for="beverage-select">Pick your morning beverage:</label>
                        <select id="beverage-select">
                            <option value="Coffee">Coffee</option>
                            <option value="Tea">Tea</option>
                            <option value="Orange Juice">Orange Juice</option>
                            <option value="Water">Water</option>
                        </select>
                    </div>
                    <p id="beverage-result" class="beverage-output"></p>
                </div>
            </section>

            <section class="project-card" id="sticker-card">
                <span class="card-dots">•••</span>
                <h3>Add a Sticker</h3>
                <div class="card-body">
                    <div class="sticker-container">
                        <img 
                            src="sun.png" 
                            alt="Smiling Sun" 
                            id="sun-image" 
                            class="sticker-img" 
                        />
                        <div id="sticker" class="emoji-sticker hidden">☀️</div>
                    </div>
                </div>
            </section>

            </main>
            <footer id="main-footer">
                <p>@alexperez</p>
            </footer>
        </div>
    </body>
</html>
